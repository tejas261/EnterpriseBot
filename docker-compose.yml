services:
  mongo:
    image: mongo:7
    container_name: ipl-live-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  mongo-init:
    image: mongo:7
    container_name: ipl-live-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./scripts/mongo-init-replica-set.js:/scripts/init.js:ro
    entrypoint: ["mongosh", "--host", "mongo:27017", "--quiet", "/scripts/init.js"]

volumes:
  mongo-data:
